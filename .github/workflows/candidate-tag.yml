name: Candidate tag

on:
  push:
    branches:
      - version-16
  workflow_dispatch:

jobs:
  detect:
    if: github.repository == 'edalca/messaging' && github.ref == 'refs/heads/version-16' && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find the version update
        id: version
        run: python3 .github/scripts/candidate_tag.py detect

  tag:
    needs: detect
    if: needs.detect.outputs.commit != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: messaging-candidate-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish and verify the annotated candidate
        env:
          CANDIDATE_COMMIT: ${{ needs.detect.outputs.commit }}
          PREVIOUS_COMMIT: ${{ needs.detect.outputs.previous }}
        run: python3 .github/scripts/candidate_tag.py publish
